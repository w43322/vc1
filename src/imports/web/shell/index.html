<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* SDL makes the canvas fill the page once the game runs (user32.cpp). */
  #canvas { display: block; outline: none; }
  /* Only for a build without packaged game data (loader.js). */
  #pick { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: 16px system-ui, sans-serif; padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<button id="pick" hidden>Choose the Virtual City game folder</button>
<input id="folder" type="file" webkitdirectory directory multiple hidden>
<script src="loader.js"></script>
</body>
</html>
